<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Halaman tidak ditemukan — Dupa Keraton</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#F2EADB">
<style>
  :root{--paper:#FBF6EC;--sand:#F2EADB;--ink:#2B281F;--bronze:#8A774B;--olive:#5E6147}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--sand);color:var(--ink);
    font-family:"Cormorant Garamond",Georgia,serif;padding:24px}
  .box{max-width:520px;text-align:center;background:var(--paper);border:1px solid rgba(138,119,75,.35);
    padding:44px 32px;border-radius:2px}
  img{width:64px;height:64px;object-fit:cover;border-radius:50%;border:1px solid rgba(138,119,75,.4)}
  p.code{letter-spacing:.28em;text-transform:uppercase;font-size:11px;color:var(--bronze);margin:22px 0 6px}
  h1{font-size:30px;font-weight:500;margin:0 0 10px;line-height:1.2}
  p.lead{margin:0 0 26px;color:var(--olive);font-size:17px;line-height:1.6}
  a{display:inline-block;background:var(--ink);color:var(--paper);text-decoration:none;padding:13px 26px;
    letter-spacing:.12em;text-transform:uppercase;font-size:12px;font-family:system-ui,sans-serif}
  a:focus-visible{outline:2px solid var(--bronze);outline-offset:3px}
</style>
</head>
<body>
  <div class="box">
    <img src="/assets/logo.jpg" alt="Logo Dupa Keraton" width="64" height="64">
    <p class="code">404</p>
    <h1>Halaman tidak ditemukan</h1>
    <p class="lead">Tautan ini tidak ada atau sudah dipindahkan. Koleksi dan lembar pesanan tetap ada di halaman utama.</p>
    <a href="/">Kembali ke halaman utama</a>
  </div>
</body>
</html>
